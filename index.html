<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Spout PiP Monitor</title>
<style>
  html, body { height: 100%; }
  /* 縦にフレックスで積み、映像が残りの高さをすべて取る。
     ボタンや通知の高さは flex が自動で差し引くので、固定値を持たない。 */
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  #bar { display: flex; gap: 8px; padding: 8px; flex: none; }
  select, button { padding: 4px 8px; }
  #version { margin-left: auto; align-self: center; color: #888; font-size: 12px; text-decoration: none; }
  #version:hover { color: #ccc; text-decoration: underline; }
  #notice, #error { padding: 0 8px; font-size: 13px; flex: none; }
  #notice { color: #fc6; }
  #error { color: #f77; }
  /* 残りの領域に object-fit: contain で収める。縦横どちらが先に詰まっても全体が見える。 */
  video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; }
</style>
</head>
<body>
  <div id="bar">
    <select id="devices"></select>
    <button id="power"></button>
    <button id="fullscreen">全画面</button>
    <button id="mirror"></button>
    <button id="pip"></button>
    <a id="version" href="https://github.com/junyatakechi/spout-pip-monitor-js" target="_blank" rel="noopener"></a>
  </div>
  <div id="notice"></div>
  <div id="error"></div>
  <video id="view" autoplay playsinline muted autopictureinpicture></video>

<script>
const VERSION = 'v1.4.0';
const STORE = 'spout-pip-monitor';

const sel = document.getElementById('devices');
const view = document.getElementById('view');
const powerBtn = document.getElementById('power');
const mirrorBtn = document.getElementById('mirror');
const pipBtn = document.getElementById('pip');
const fsBtn = document.getElementById('fullscreen');
const notice = document.getElementById('notice');
const error = document.getElementById('error');

// PiP ウィンドウには video 要素の CSS が適用されないため、
// canvas に反転して描き直したフレームを PiP の映像源にする。
const src = Object.assign(document.createElement('video'), { muted: true, playsInline: true });
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

let stream;
let mirrored = false;
let on = true;

// localStorage は file:// や Cookie 制限下で例外を投げうるので、失敗しても動くようにする。
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
}

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ mirrored, deviceId: sel.value }));
  } catch {}
}

function drawFrame() {
  // 停止中は黒を描き続ける。captureStream は canvas に紐づくので、
  // カメラを手放しても PiP ウィンドウは開いたまま黒い映像になる。
  if (!on) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    return;
  }
  if (!src.videoWidth) return;
  canvas.width = src.videoWidth;
  canvas.height = src.videoHeight;
  ctx.setTransform(mirrored ? -1 : 1, 0, 0, 1, mirrored ? canvas.width : 0, 0);
  ctx.drawImage(src, 0, 0);
}

function loop() {
  drawFrame();
  requestAnimationFrame(loop);
}

function renderPower() {
  powerBtn.textContent = on ? 'カメラ: ON' : 'カメラ: OFF';
}

function renderMirror() {
  mirrorBtn.textContent = mirrored ? '左右反転: ON' : '左右反転: OFF';
}

function renderPip() {
  pipBtn.textContent = document.pictureInPictureElement === view ? 'PiPを終了' : 'PiPで表示';
}

async function listDevices() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  sel.innerHTML = '';
  cams.forEach((d, i) => sel.add(new Option(d.label || `カメラ ${i + 1}`, d.deviceId)));

  // file:// はオリジンが null になるため、Chrome は getUserMedia が成功した後も
  // enumerateDevices() を制限し、deviceId と label を空文字で返す。
  // その状態ではデバイスを指定できないので、切り替えは成立しない。
  const switchable = cams.some(d => d.deviceId);
  sel.disabled = !switchable;
  notice.textContent = switchable ? ''
    : 'デバイスを切り替えるには http://localhost などのオリジンから開いてください。file:// では Chrome が deviceId を返しません。';
}

// トラックを止めるとデバイスが解放され、タブのカメラ表示も消える。
function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  src.srcObject = null;
}

async function start(deviceId) {
  stop();
  stream = await navigator.mediaDevices.getUserMedia({
    video: deviceId ? { deviceId: { exact: deviceId } } : true
  });
  src.srcObject = stream;
  // 切り替えが続くと直前の play() が新しい load に中断されるが、
  // 新しいストリームは再生されるので AbortError は無視してよい。
  try { await src.play(); } catch (e) { if (e.name !== 'AbortError') throw e; }
  drawFrame();
  if (!view.srcObject) view.srcObject = canvas.captureStream();
}

async function init() {
  const saved = load();
  mirrored = saved.mirrored === true;
  renderMirror();
  renderPower();

  try {
    await start(saved.deviceId);
  } catch (e) {
    if (!saved.deviceId) throw e;
    await start(); // 前回のカメラが見つからないときは既定のカメラに戻す
  }

  await listDevices();
  const used = stream.getVideoTracks()[0].getSettings().deviceId;
  if (used) sel.value = used;
  save();
}

mirrorBtn.onclick = () => {
  mirrored = !mirrored;
  renderMirror();
  save();
};

// 停止中の選択は保存だけしておき、次にオンにしたときのカメラにする。
sel.onchange = () => on ? start(sel.value).then(save).catch(e => error.textContent = e) : save();

// オフはデバイスを手放す操作なので、自動 PiP は capture 中のページにしか
// 発火しない以上、オフの間は働かない。PiP を開いたままなら黒い映像になる。
powerBtn.onclick = async () => {
  on = !on;
  renderPower();
  error.textContent = '';
  if (!on) return stop();
  try {
    await start(sel.value);
  } catch (e) {
    error.textContent = e;
    on = false;
    renderPower();
  }
};

// 全画面は映像だけにする。解除はブラウザ標準の Esc に任せる。
fsBtn.onclick = () => view.requestFullscreen().catch(e => error.textContent = e);

pipBtn.onclick = async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await view.requestPictureInPicture();
  } catch (e) { error.textContent = e; }
};

// PiP ウィンドウ側の閉じるボタンでも抜けられるので、状態はイベントから拾う。
view.addEventListener('enterpictureinpicture', renderPip);
view.addEventListener('leavepictureinpicture', renderPip);

// カメラを capture 中のページに限り、Chrome 120 以降はタブから離れたときに
// この action を発火させる。ここでだけユーザー操作なしに PiP へ入れる。
function enterPipFromMediaSession() {
  if (document.pictureInPictureElement) return;
  // 発火時はページが隠れているので、失敗は戻ってきたときに読めるよう残す。
  view.requestPictureInPicture().catch(e => { error.textContent = e; });
}

try {
  navigator.mediaSession.setActionHandler('enterpictureinpicture', enterPipFromMediaSession);
} catch {
  // 未対応のブラウザでは TypeError になるが、手動の PiP は使えるので無視する。
}

// document.lastModified は配信サーバーの Last-Modified を反映するので、
// GitHub Pages ではデプロイ時刻になる。反映されたかの判別に使う。
const built = new Date(document.lastModified);
const pad = n => String(n).padStart(2, '0');
document.getElementById('version').textContent =
  `${VERSION} · ${built.getFullYear()}-${pad(built.getMonth() + 1)}-${pad(built.getDate())}`
  + ` ${pad(built.getHours())}:${pad(built.getMinutes())}`;

renderPip();
loop();
init().catch(e => error.textContent = e);
</script>
</body>
</html>
