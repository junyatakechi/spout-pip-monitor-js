<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SpoutCam PiP</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
  #bar { display: flex; gap: 8px; padding: 8px; }
  select, button { padding: 4px 8px; }
  video { display: block; width: 100%; background: #000; }
  #error { padding: 8px; color: #f77; }
</style>
</head>
<body>
  <div id="bar">
    <select id="devices"></select>
    <button id="pip">PiPで表示</button>
  </div>
  <video id="view" autoplay playsinline muted></video>
  <div id="error"></div>

<script>
const sel = document.getElementById('devices');
const view = document.getElementById('view');
const error = document.getElementById('error');
let stream;

async function listDevices() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  sel.innerHTML = '';
  for (const d of devices.filter(d => d.kind === 'videoinput')) {
    sel.add(new Option(d.label || d.deviceId, d.deviceId));
  }
}

async function start(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: deviceId ? { deviceId: { exact: deviceId } } : true
  });
  view.srcObject = stream;
}

sel.onchange = () => start(sel.value).catch(e => error.textContent = e);
document.getElementById('pip').onclick = () => view.requestPictureInPicture();

start()
  .then(listDevices)
  .catch(e => error.textContent = e);
</script>
</body>
</html>
